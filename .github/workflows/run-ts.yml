name: Run TypeScript Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-ts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run script and save logs
        run: |
          mkdir -p logs

          npx ts-node src/index.ts \
            > logs/output.log \
            2> logs/error.log || true

      - name: Show error log
        run: |
          if [ -s logs/error.log ]; then
            echo "❌ Errors found:"
            cat logs/error.log
          else
            echo "✅ No errors"
          fi

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: ts-logs
          path: logs/
